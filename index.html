<!DOCTYPE html>
<html lang="zh-CN">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg-1:#f0f4ff;--bg-2:#fff5f8;--bg-3:#f0fff8;
--card-bg:#fff;--text-main:#1a1a2e;--text-sub:#6b7280;
--line-color:#d1d5db;--shadow-soft:0 4px 24px rgba(0,0,0,.06);--shadow-hover:0 12px 40px rgba(0,0,0,.12);
--radius:16px;--font:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
--header-bg:rgba(255,255,255,.7);--header-border:rgba(255,255,255,.6);--header-shadow:0 2px 16px rgba(0,0,0,.04);
--logo-grad:linear-gradient(135deg,#7C5CFC,#E8557A);--logo-pulse:rgba(124,92,252,.3);
--btn-p-grad:linear-gradient(135deg,#7C5CFC,#9B7BFF);--btn-p-shadow:rgba(124,92,252,.35);--btn-p-shadow-h:rgba(124,92,252,.45);
--btn-g-bg:rgba(255,255,255,.8);--btn-g-border:rgba(0,0,0,.06);--btn-g-hover:#fff;
--inp-bg:#f9fafb;--inp-border:#e5e7eb;--inp-fb:#7C5CFC;--inp-fs:rgba(124,92,252,.1);--inp-fbg:#fff;
--prec-bg:#f3f4f6;--prec-ab:#fff;--prec-as:0 2px 8px rgba(0,0,0,.08);
--pk-bg:#f9fafb;--pk-border:#e5e7eb;--opt-hb:#7C5CFC;--opt-sb:rgba(124,92,252,.1);
--overlay-bg:rgba(0,0,0,.4);--modal-bg:#fff;
--close-bg:rgba(0,0,0,.05);--close-hb:rgba(0,0,0,.1);
--action-bg:rgba(0,0,0,.05);--action-hb:rgba(0,0,0,.1);
--toast-bg:#1a1a2e;--toast-color:#fff;
--line-grad:linear-gradient(to bottom,#7C5CFC,#E8557A,#22C5A5);--line-grad-h:linear-gradient(to right,#7C5CFC,#E8557A,#22C5A5);
--sb-thumb:rgba(124,92,252,.3);--sb-track:rgba(0,0,0,.04);
--p1:#7C5CFC;--p2:#E8557A;--p3:#22C5A5;--p4:#F5A623;--p5:#4A90D9;
--cinema-bg:rgba(0,0,0,.92);
--cat-study:#4A90D9;--cat-career:#7C5CFC;--cat-family:#E8557A;--cat-travel:#22C5A5;--cat-award:#F5A623;--cat-health:#2DBEA8;--cat-other:#8895A7;
}
body{font-family:var(--font);background:linear-gradient(135deg,var(--bg-1),var(--bg-2),var(--bg-3));min-height:100vh;color:var(--text-main);transition:background .6s;overflow-x:hidden}
.particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;bottom:-40px;border-radius:50%;opacity:0;animation:float-up linear infinite}
@keyframes float-up{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.3}90%{opacity:.3}100%{transform:translateY(-110vh) rotate(360deg);opacity:0}}
.header{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:16px 32px;background:var(--header-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--header-border);box-shadow:var(--header-shadow)}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{width:48px;height:48px;border-radius:14px;background:var(--logo-grad);display:flex;align-items:center;justify-content:center;color:#fff;animation:logo-pulse 3s ease-in-out infinite}
.header-logo svg{width:26px;height:26px}
@keyframes logo-pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 var(--logo-pulse)}50%{transform:scale(1.05);box-shadow:0 0 0 12px transparent}}
.header-title{font-size:22px;font-weight:800}
.header-subtitle{font-size:13px;color:var(--text-sub)}
.header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border:none;border-radius:12px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
.btn-icon{display:inline-flex;align-items:center;justify-content:center}
.btn-icon svg{width:16px;height:16px}
.btn-primary{background:var(--btn-p-grad);color:#fff;box-shadow:0 4px 14px var(--btn-p-shadow)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px var(--btn-p-shadow-h)}
.btn-ghost{background:var(--btn-g-bg);color:var(--text-main);border:1px solid var(--btn-g-border)}
.btn-ghost:hover{background:var(--btn-g-hover);transform:translateY(-2px);box-shadow:var(--shadow-soft)}
.theme-selector{position:relative}
.theme-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--card-bg);border-radius:14px;box-shadow:var(--shadow-hover);padding:8px;min-width:160px;display:none;flex-direction:column;gap:2px;z-index:200}
.theme-dropdown.show{display:flex}
.more-menu{position:relative;display:inline-flex}
.more-dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--card-bg);border-radius:14px;box-shadow:var(--shadow-hover);padding:8px;min-width:160px;display:none;flex-direction:column;gap:2px;z-index:200}
.more-dropdown.show{display:flex}
.more-dropdown .dropdown-item{justify-content:flex-start;width:100%;font-size:14px}
.more-dropdown .dropdown-space{padding:6px 10px;font-size:13px;color:var(--text-secondary);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:4px 0;word-break:break-all}
.theme-option{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;color:var(--text-main);transition:background .2s}
.theme-option:hover{background:var(--action-bg)}
.theme-option.active{background:var(--opt-sb)}
.theme-option-icon{font-size:18px}
/* 播放控制条 */
.playback-bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--card-bg);border-radius:16px;box-shadow:var(--shadow-hover);z-index:1500;opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1)}
.playback-bar.active{transform:translateX(-50%) translateY(0);opacity:1}
.playback-exit{width:36px;height:36px;border-radius:10px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--action-bg);color:var(--text-sub);transition:all .2s}
.playback-exit svg{width:16px;height:16px}
.playback-exit:hover{background:var(--action-hb);transform:scale(1.1)}
.playback-progress{width:180px;height:4px;background:var(--action-bg);border-radius:2px;overflow:hidden}
.playback-progress-bar{height:100%;background:var(--btn-p-grad);width:0;transition:width .4s ease;border-radius:2px}
.playback-count{font-size:13px;font-weight:700;color:var(--text-sub);white-space:nowrap}
.playback-action{padding:7px 14px;border-radius:10px;border:none;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:700;background:var(--btn-p-grad);color:#fff;box-shadow:0 3px 10px var(--btn-p-shadow);transition:all .2s}
.playback-action:hover{transform:translateY(-1px);box-shadow:0 4px 14px var(--btn-p-shadow-h)}
.playback-action.recording{animation:recording-pulse 1.2s ease-in-out infinite}
@keyframes recording-pulse{0%,100%{box-shadow:0 3px 10px var(--btn-p-shadow)}50%{box-shadow:0 0 0 6px rgba(232,85,122,.25)}}
/* ===== 播放设置 ===== */
.settings-list{display:flex;flex-direction:column;gap:12px}
.settings-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--inp-bg);border:1.5px solid var(--inp-border);cursor:pointer;transition:all .2s}
.settings-item:hover{border-color:var(--inp-fb);background:var(--inp-fbg)}
.settings-item-label{font-size:14px;font-weight:600;color:var(--text-main)}
.settings-toggle{width:44px;height:24px;border-radius:12px;background:var(--line-color);position:relative;transition:background .2s}
.settings-toggle::after{content:'';position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.settings-item.active .settings-toggle{background:var(--btn-p-grad)}
.settings-item.active .settings-toggle::after{transform:translateX(20px)}
/* ===== 播放模式 ===== */
.playback-mode .timeline-line{animation:none;transition:height .42s cubic-bezier(.34,1.56,.64,1),width .42s cubic-bezier(.34,1.56,.64,1)}
.playback-mode.timeline-vertical .timeline-line{position:absolute;left:60px;top:0;bottom:auto;width:3px;height:0;transform:none;background:var(--line-grad);border-radius:2px}
.playback-mode.timeline-horizontal .timeline-line{position:absolute;left:0;top:auto;bottom:60px;height:3px;width:0;transform:none;background:var(--line-grad-h);border-radius:2px}

/* Items */
.playback-mode .pb-item{position:relative}
.playback-mode .pb-content{opacity:0;transform:scale(.3)}
.playback-mode .pb-item.grown .pb-content{animation-fill-mode:forwards;animation-duration:.7s;animation-timing-function:cubic-bezier(.34,1.56,.64,1)}
.playback-mode .pb-node{opacity:0;transform:scale(0)}
.playback-mode .pb-item.grown .pb-node{animation:pb-node-in .4s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:.1s}
@keyframes pb-node-in{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:scale(1)}}

/* Growth animations - emerge from timeline */
@keyframes pb-grow-right{0%{opacity:0;transform:scale(.3) translateX(-70px)}55%{opacity:1;transform:scale(1.04) translateX(5px)}100%{opacity:1;transform:scale(1) translateX(0)}}
@keyframes pb-grow-up{0%{opacity:0;transform:scale(.3) translateY(70px)}55%{opacity:1;transform:scale(1.04) translateY(-5px)}100%{opacity:1;transform:scale(1) translateY(0)}}

/* Node */
.pb-node{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--node-color);border:3px solid var(--card-bg);z-index:3;box-shadow:0 0 0 4px var(--card-bg),0 0 0 6px var(--node-color)}
.pb-node::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--node-color);opacity:0;animation:pb-ripple 2s ease-out infinite;animation-delay:.5s}
@keyframes pb-ripple{0%{transform:scale(.8);opacity:.5}100%{transform:scale(2.2);opacity:0}}

/* Connector */
.pb-connector{position:absolute;background:var(--node-color);opacity:.35;width:2px;border-radius:1px}

/* Content boxes */
.pb-content{position:relative;display:flex;gap:12px;align-items:flex-start}
.pb-icon-circle{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--node-color);color:#fff;flex-shrink:0;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.pb-text-stack{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pb-date-box{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:10px;background:var(--card-bg);border:1.5px solid var(--node-color);box-shadow:0 2px 10px rgba(0,0,0,.06);font-size:13px;font-weight:700;color:var(--node-color)}
.pb-date-box svg{width:13px;height:13px;flex-shrink:0}
.pb-title-box{padding:14px 20px;border-radius:14px;background:var(--card-bg);box-shadow:var(--shadow-soft);border-left:4px solid var(--node-color)}
.pb-title{font-size:24px;font-weight:800;color:var(--text-main);line-height:1.35}
.pb-cat-tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--node-color);color:#fff;margin-top:8px}

/* Vertical layout: all events on the right */
.playback-mode.timeline-vertical{padding:20px 0 80px 0}
.playback-mode.timeline-vertical .pb-item{width:auto;padding:24px 24px 24px 90px;text-align:left}
.playback-mode.timeline-vertical .pb-item .pb-content{align-items:flex-start;transform-origin:left center}
.playback-mode.timeline-vertical .pb-item.grown .pb-content{animation-name:pb-grow-right}
.playback-mode.timeline-vertical .pb-node{left:54px;top:46px}
.playback-mode.timeline-vertical .pb-connector{display:none}

/* Horizontal layout: all events above the line */
.playback-mode.timeline-horizontal{overflow-x:auto;padding:40px 0 120px 0;scroll-behavior:smooth}
.playback-mode.timeline-horizontal .timeline-track{display:flex;gap:28px;padding:0 60px 80px 80px;position:relative;min-height:360px;align-items:flex-end}
.playback-mode.timeline-horizontal .pb-item{flex-shrink:0;width:auto;min-width:190px;max-width:280px;padding-bottom:70px}
.playback-mode.timeline-horizontal .pb-item .pb-content{transform-origin:bottom center}
.playback-mode.timeline-horizontal .pb-item.grown .pb-content{animation-name:pb-grow-up}
.playback-mode.timeline-horizontal .pb-node{bottom:54px;left:50%;transform:translateX(-50%)}
.playback-mode.timeline-horizontal .pb-connector{left:50%;transform:translateX(-50%);bottom:68px;height:54px;width:2px}

/* Horizontal single card */
.playback-mode.timeline-horizontal .pb-card{width:100%;background:var(--card-bg);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-soft);border-top:4px solid var(--node-color);display:flex;flex-direction:column;gap:8px;transition:transform .25s,box-shadow .25s}
.playback-mode.timeline-horizontal .pb-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.playback-mode.timeline-horizontal .pb-card-header{display:flex;align-items:center;gap:10px}
.playback-mode.timeline-horizontal .pb-title{font-size:18px;font-weight:800;color:var(--text-main);line-height:1.35}
.playback-mode.timeline-horizontal .pb-date-box{font-size:12px;padding:4px 10px}
.playback-mode.timeline-horizontal .pb-desc{font-size:13px;color:var(--text-sub);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.playback-mode.timeline-horizontal .pb-card-footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.playback-mode.timeline-horizontal .pb-mood{font-size:11px;color:var(--text-sub);font-style:italic;display:flex;align-items:center;gap:3px;writing-mode:horizontal-tb;text-orientation:mixed;white-space:nowrap}
.playback-mode.timeline-horizontal .pb-mood svg{width:11px;height:11px;flex-shrink:0}
.playback-mode.timeline-horizontal .pb-content{width:100%}

/* Vertical optional fields */
.playback-mode.timeline-vertical .pb-desc{font-size:13px;color:var(--text-sub);line-height:1.5;padding:10px 14px;background:var(--card-bg);border-radius:10px;box-shadow:var(--shadow-soft);border-left:3px solid var(--node-color);max-width:320px}
.playback-mode.timeline-vertical .pb-mood{font-size:12px;color:var(--text-sub);font-style:italic;display:flex;align-items:center;gap:4px;margin-top:2px;writing-mode:horizontal-tb;text-orientation:mixed;white-space:nowrap}

/* End text */
.pb-end{position:relative;opacity:0}
.pb-end.grown{animation:pb-end-grow .8s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes pb-end-grow{0%{opacity:0;transform:scale(.3)}55%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
.pb-end-content{transform-origin:center}
.pb-end-text{font-size:18px;font-weight:700;color:var(--text-sub);letter-spacing:3px;margin-bottom:10px}
.pb-end-poem{font-size:15px;color:var(--text-sub);font-style:italic;opacity:0;transition:opacity 1.2s ease .6s}
.pb-end.grown .pb-end-poem{opacity:.85}

/* Vertical end: on the right */
.playback-mode.timeline-vertical .pb-end{width:auto;padding:40px 24px 40px 90px;text-align:left}
.playback-mode.timeline-vertical .pb-end .pb-end-content{align-items:flex-start}

/* Horizontal end: above the line */
.playback-mode.timeline-horizontal .pb-end{flex-shrink:0;width:auto;min-width:160px;max-width:240px;padding-bottom:78px;display:flex;align-items:flex-start;justify-content:center}
.playback-mode.timeline-horizontal .pb-end .pb-end-content{display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--card-bg);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow-soft);border-top:4px solid var(--node-color)}
.playback-mode.timeline-horizontal .pb-end-text{letter-spacing:3px;margin-bottom:8px}
.playback-mode.timeline-horizontal .pb-end-poem{font-size:14px}
.timeline-container{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:40px 32px 80px}
.timeline{position:relative}
.timeline-vertical{padding:20px 0}
.timeline-vertical .timeline-line{position:absolute;left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%);background:var(--line-grad);border-radius:2px;animation:draw-line 1.5s ease-out forwards}
@keyframes draw-line{from{height:0}to{height:100%}}
.timeline-vertical .event-item{position:relative;width:50%;padding:20px 40px;opacity:0;transition:opacity .6s ease,transform .6s ease}
.timeline-vertical .event-item.revealed{opacity:1}
.timeline-vertical .event-item:nth-child(odd){left:0;text-align:right}
.timeline-vertical .event-item:nth-child(even){left:50%;text-align:left}
.event-node{position:absolute;top:28px;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border:4px solid var(--card-bg);z-index:2;background:var(--node-color);animation:node-pop .6s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes node-pop{0%{transform:scale(0) rotate(-180deg)}100%{transform:scale(1) rotate(0)}}
.timeline-vertical .event-item:nth-child(odd) .event-node{right:-26px}
.timeline-vertical .event-item:nth-child(even) .event-node{left:-26px}
.event-node::after{content:'';position:absolute;inset:-4px;border-radius:50%;animation:node-glow 2s ease-in-out infinite}
@keyframes node-glow{0%,100%{box-shadow:0 0 0 0 var(--node-color)}50%{box-shadow:0 0 0 8px transparent}}
.event-card{position:relative;background:var(--card-bg);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-soft);cursor:pointer;transition:all .3s;animation:card-slide .6s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:var(--delay)}
@keyframes card-slide{0%{opacity:0;transform:translateX(30px) scale(.9)}100%{opacity:1;transform:translateX(0) scale(1)}}
.event-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
.timeline-vertical .event-item:nth-child(odd) .event-card{animation-name:card-slide-l}
@keyframes card-slide-l{0%{opacity:0;transform:translateX(-30px) scale(.9)}100%{opacity:1;transform:translateX(0) scale(1)}}
.card-actions{position:absolute;top:10px;right:10px;display:flex;gap:6px;opacity:0;transition:opacity .2s}
.event-card:hover .card-actions{opacity:1}
.card-action-btn{width:28px;height:28px;border-radius:8px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--action-bg);color:var(--text-sub);transition:all .2s}
.card-action-btn svg{width:14px;height:14px}
.card-action-btn:hover{background:var(--action-hb);transform:scale(1.1)}
.card-date{font-size:13px;font-weight:700;color:var(--node-color);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.timeline-vertical .event-item:nth-child(odd) .card-date{justify-content:flex-end}
.timeline-vertical .event-item:nth-child(even) .card-date{justify-content:flex-start}
.card-date svg{width:14px;height:14px;flex-shrink:0}
.card-title{font-size:18px;font-weight:800;margin-bottom:4px}
.card-desc{font-size:14px;color:var(--text-sub);line-height:1.5;margin-bottom:8px}
.card-footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-category{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--node-color);color:#fff}
.card-mood{font-size:12px;color:var(--text-sub);font-style:italic;display:flex;align-items:center;gap:4px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;writing-mode:horizontal-tb;text-orientation:mixed}
.card-mood svg{width:13px;height:13px;flex-shrink:0}
.timeline-horizontal{overflow-x:auto;padding:40px 0;scroll-behavior:smooth}
.timeline-horizontal .timeline-line{position:absolute;top:50%;left:0;right:0;height:3px;transform:translateY(-50%);background:var(--line-grad-h);border-radius:2px;animation:draw-line-h 1.5s ease-out forwards}
@keyframes draw-line-h{from{width:0}to{width:100%}}
.timeline-horizontal .timeline-track{display:flex;gap:30px;padding:0 40px;position:relative}
.timeline-horizontal .event-item{flex-shrink:0;width:260px;position:relative;opacity:0;transition:opacity .6s}
.timeline-horizontal .event-item.revealed{opacity:1}
.timeline-horizontal .event-item:nth-child(odd){padding-bottom:80px}
.timeline-horizontal .event-item:nth-child(even){padding-top:80px}
.timeline-horizontal .event-node{position:absolute;left:50%;transform:translateX(-50%);width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border:4px solid var(--card-bg);z-index:2;background:var(--node-color);animation:node-pop .6s cubic-bezier(.34,1.56,.64,1) forwards}
.timeline-horizontal .event-item:nth-child(odd) .event-node{bottom:14px}

function applyTheme(name){

// ===== IndexedDB 持久化（比 localStorage 更可靠，手机清理缓存更不易丢失）=====
const IDB_NAME='life_timeline_db_v1';
const IDB_STORE='kv';
const BACKUP_KEY='full_backup_v2';
let _dbPromise=null;
function _openDB(){
  if(_dbPromise)return _dbPromise;
  _dbPromise=new Promise((resolve,reject)=>{
    if(!window.indexedDB){reject(new Error('no indexedDB'));return;}
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(IDB_STORE))req.result.createObjectStore(IDB_STORE);};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
  return _dbPromise;
}
function idbGet(key){
  return _openDB().then(db=>new Promise((resolve,reject)=>{
    const r=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(key);
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  })).catch(()=>null);
}
function idbSet(key,val){
  return _openDB().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(val,key);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  })).catch(()=>{});
}

// ===== 数据层 =====
function buildBackup(){return {events:events,timelines:timelines,currentTimelineId:currentTimelineId};}
// 只存本地（不触发云端推送）—— syncFromCloud 拉取后用此保存
function saveLocalOnly(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(events));
  localStorage.setItem(TL_KEY,JSON.stringify(timelines));
  localStorage.setItem(TL_CUR_KEY,currentTimelineId||'');
  idbSet(BACKUP_KEY,buildBackup());
}
window.saveLocalOnly=saveLocalOnly;
function saveTimelines(){
  const now=Date.now();
  timelines.forEach(t=>{if(t)t.updatedAt=now;});
  localStorage.setItem(TL_KEY,JSON.stringify(timelines));
  idbSet(BACKUP_KEY,buildBackup());
  timelines.forEach(t=>{if(t&&typeof unmarkDeleted==='function')unmarkDeleted(t.id);});
  pushCloud();
}
function saveCurrentTl(){localStorage.setItem(TL_CUR_KEY,currentTimelineId||'');idbSet(BACKUP_KEY,buildBackup());pushCloud();}
function getCurrentEvents(){return events.filter(e=>e.timelineId===currentTimelineId);}
function getCurrentTimeline(){return timelines.find(t=>t.id===currentTimelineId)||null;}
function countEvents(tlId){return events.filter(e=>e.timelineId===tlId).length;}
async function loadData(){
  // v3 一次性清理旧版污染数据（IndexedDB + localStorage 全部重置）
  if(!localStorage.getItem('lt_data_v3')){
    try{
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(TL_KEY);
      localStorage.removeItem(TL_CUR_KEY);
    }catch(e){}
    try{localStorage.setItem('lt_data_v3','1');}catch(e){}
    events=[];timelines=[];currentTimelineId='';
  }

  // 从 IndexedDB 或 localStorage 加载本地缓存
  const bk=await idbGet(BACKUP_KEY);
  if(bk&&Array.isArray(bk.events)&&Array.isArray(bk.timelines)&&bk.timelines.length>0){
    events=bk.events;
    timelines=bk.timelines;
    currentTimelineId=(bk.currentTimelineId&&timelines.some(t=>t.id===bk.currentTimelineId))?bk.currentTimelineId:timelines[0].id;
  }else{
    try{
      const raw=localStorage.getItem(STORAGE_KEY);
      const rawTl=localStorage.getItem(TL_KEY);
      events=raw?JSON.parse(raw):[];
      if(!Array.isArray(events))events=[];
      timelines=rawTl?JSON.parse(rawTl):[];
      if(!Array.isArray(timelines))timelines=[];
    }catch(e){events=[];timelines=[];}
  }
  if(!currentTimelineId||!timelines.some(t=>t.id===currentTimelineId)){
    currentTimelineId=timelines.length>0?timelines[0].id:'';
  }
  // 加载完成后立即去重（旧版污染可能产生重复 id）
  const evMap=new Map();
  events.forEach(e=>{
    if(!e||!e.id)return;
    if(!evMap.has(e.id)||(e.updatedAt||0)>(evMap.get(e.id).updatedAt||0))evMap.set(e.id,e);
  });
  events=Array.from(evMap.values());
  const tlMap=new Map();
  timelines.forEach(t=>{
    if(!t||!t.id)return;
    if(!tlMap.has(t.id)||(t.updatedAt||0)>(tlMap.get(t.id).updatedAt||0))tlMap.set(t.id,t);
  });
  timelines=Array.from(tlMap.values());
  events.forEach(e=>{if(!e.timelineId)e.timelineId=currentTimelineId||timelines[0]?.id;});
  migrateEvents();

  // 与云端双向合并同步（静默模式：未配置 Token 时跳过，不弹窗）
  await syncFromCloud(true);

  // 同步后如果仍然没有任何时间线，创建一个默认的并推到云端
  if(timelines.length===0){
    const def={id:uid(),name:'我的时间线',emoji:'🌟',createdAt:Date.now()};
    timelines=[def];
    currentTimelineId=def.id;
    await pushCloud();
  }
  if(!currentTimelineId||!timelines.some(t=>t.id===currentTimelineId)){
    currentTimelineId=timelines[0].id;
  }
  // 孤儿事件修复：归属不存在时间线的事件，归并到第一个有效时间线（避免数据丢失）
  if(timelines.length>0){
    const valid=new Set(timelines.map(t=>t.id));
    events.forEach(e=>{ if(!valid.has(e.timelineId)){ e.timelineId=timelines[0].id; } });
  }
  saveLocalOnly();
}
// persistAll：存本地 + 推云端（用于手动保存场景）
function persistAll(){
  const now=Date.now();
  events.forEach(e=>{if(e)e.updatedAt=now;});
  timelines.forEach(t=>{if(t)t.updatedAt=now;});
  saveLocalOnly();
  pushCloud();
}
function migrateEvents(){
  let changed=false;
  events.forEach(e=>{
    if(!e.datePrecision){e.datePrecision='day';changed=true;}
    if(!e.id){e.id=uid();changed=true;}
    if(!e.timelineId){e.timelineId=currentTimelineId;changed=true;}
  });
  if(changed)saveData();
}
function saveData(){
  const now=Date.now();
  events.forEach(e=>{if(e)e.updatedAt=now;});
  localStorage.setItem(STORAGE_KEY,JSON.stringify(events));
  idbSet(BACKUP_KEY,buildBackup());
  events.forEach(e=>{if(e&&typeof unmarkDeleted==='function')unmarkDeleted(e.id);});
  pushCloud();
}

// ===== 日期格式化 =====
function formatDate(dateStr,precision){
  if(!dateStr)return'';
  const d=new Date(dateStr);
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  if(precision==='year')return y+'年';
  if(precision==='month')return y+'年'+parseInt(m)+'月';
  return y+'年'+parseInt(m)+'月'+parseInt(day)+'日';
}

function initPrecisionToggle(){

    });
  });

function setPrecision(p){
  currentPrecision=p;
  document.querySelectorAll('.precision-btn').forEach(b=>b.classList.toggle('active',b.dataset.precision===p));
  const dDay=document.getElementById('f-date-day');
  const dMonth=document.getElementById('f-date-month');
  const dYear=document.getElementById('f-date-year');
  dDay.style.display=p==='day'?'block':'none';
  dMonth.style.display=p==='month'?'block':'none';
  dYear.style.display=p==='year'?'block':'none';

  dMonth.required=p==='month';

function getDateValue(){
  if(currentPrecision==='day')return document.getElementById('f-date-day').value;
  if(currentPrecision==='month')return document.getElementById('f-date-month').value+'-01';
  if(currentPrecision==='year')return document.getElementById('f-date-year').value;
  return'';
}
function setDateValue(dateStr,precision){
  if(!dateStr||!precision||precision==='day'){
    if(document.getElementById('f-date-day').value===undefined||!dateStr){
      document.getElementById('f-date-day').value=new Date().toISOString().slice(0,10);
      return;
    }
    document.getElementById('f-date-day').value=dateStr.slice(0,10);
    return;
  }
  if(precision==='month'){
    document.getElementById('f-date-month').value=dateStr.slice(0,7);
  }else if(precision==='year'){
    const y=dateStr.slice(0,4);
    document.getElementById('f-date-year').value=y+'-01-01';
  }
}

// ===== 时间线渲染 =====
function renderTimeline(){
  const curEvents=getCurrentEvents();
  const curTl=getCurrentTimeline();
  if(curEvents.length===0){
    $timeline.className='timeline';
    $timeline.innerHTML='<div class="empty-state"><div class="empty-icon">'+IC.clock+'</div><h3>「'+escapeHtml(curTl?curTl.name:'')+'」还没有微光</h3><p>点击「捕捉微光」按钮，记录第一个精彩瞬间</p><button class="btn btn-primary" onclick="openModal()"><span class="btn-icon">'+IC.plus+'</span>捕捉第一缕微光</button></div>';
    return;
  }
  // 渲染前按 id 去重，保留 updatedAt 最新的一条
  const uniqueMap=new Map();
  curEvents.forEach(e=>{
    if(!e||!e.id)return;
    if(!uniqueMap.has(e.id)||(e.updatedAt||0)>(uniqueMap.get(e.id).updatedAt||0))uniqueMap.set(e.id,e);
  });
  const sorted=[...uniqueMap.values()].sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(direction==='vertical'){
    $timeline.className='timeline timeline-vertical';
    let html='<div class="timeline-line"></div>';
    sorted.forEach((ev,i)=>{
      const color=getColor(ev.category);
      const delay=(i*0.12)+'s';
      const editSvg=IC.edit,trashSvg=IC.trash,calSvg=IC.calendar,msgSvg=IC.message;
      html+='<div class="event-item" style="--delay:'+delay+';--node-color:'+color+'">'
        +'<div class="event-node" onclick="openModal(\''+ev.id+'\')" style="--node-color:'+color+'">'+(ev.emoji||'✨')+'</div>'
        +'<div class="event-card" onclick="openModal(\''+ev.id+'\')" style="--node-color:'+color+';--delay:'+delay+'">'
        +'<div class="card-actions">'
        +'<button class="card-action-btn" onclick="event.stopPropagation();openModal(\''+ev.id+'\')" title="编辑">'+editSvg+'</button>'
        +'<button class="card-action-btn" onclick="event.stopPropagation();deleteEvent(\''+ev.id+'\')" title="删除">'+trashSvg+'</button>'
        +'</div>'
        +'<div class="card-date">'+calSvg+formatDate(ev.date,ev.datePrecision)+'</div>'
        +'<div class="card-title">'+escapeHtml(ev.title)+'</div>'
        +(ev.description?'<div class="card-desc">'+escapeHtml(ev.description)+'</div>':'')
        +'<div class="card-footer"><span class="card-category">'+ev.category+'</span>'
        +(ev.mood?'<span class="card-mood">'+msgSvg+escapeHtml(ev.mood)+'</span>':'')
        +'</div></div></div>';
    });
    $timeline.innerHTML=html;
  }else{
    $timeline.className='timeline timeline-horizontal';
    let html='<div class="timeline-line"></div><div class="timeline-track">';
    sorted.forEach((ev,i)=>{
      const color=getColor(ev.category);
      const delay=(i*0.12)+'s';
      const editSvg=IC.edit,trashSvg=IC.trash,calSvg=IC.calendar,msgSvg=IC.message;
      html+='<div class="event-item" style="--delay:'+delay+';--node-color:'+color+'">'
        +'<div class="event-connector"></div>'
        +'<div class="event-node" onclick="openModal(\''+ev.id+'\')" style="--node-color:'+color+'">'+(ev.emoji||'✨')+'</div>'
        +'<div class="event-card" onclick="openModal(\''+ev.id+'\')" style="--node-color:'+color+';--delay:'+delay+'">'
        +'<div class="card-actions">'
        +'<button class="card-action-btn" onclick="event.stopPropagation();openModal(\''+ev.id+'\')" title="编辑">'+editSvg+'</button>'
        +'<button class="card-action-btn" onclick="event.stopPropagation();deleteEvent(\''+ev.id+'\')" title="删除">'+trashSvg+'</button>'
        +'</div>'
        +'<div class="card-date">'+calSvg+formatDate(ev.date,ev.datePrecision)+'</div>'
        +'<div class="card-title">'+escapeHtml(ev.title)+'</div>'
        +(ev.description?'<div class="card-desc">'+escapeHtml(ev.description)+'</div>':'')
        +'<div class="card-footer"><span class="card-category">'+ev.category+'</span>'
        +(ev.mood?'<span class="card-mood">'+msgSvg+escapeHtml(ev.mood)+'</span>':'')

// ===== 滚动触发显示 =====
function revealItems(){
  if(playbackActive)return;
  const items=document.querySelectorAll('.event-item');
  if(!('IntersectionObserver'in window)){
    items.forEach((it,i)=>{setTimeout(()=>it.classList.add('revealed'),i*120);});
    return;
  }
  const io=new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        const idx=Array.from(items).indexOf(en.target);
        setTimeout(()=>en.target.classList.add('revealed'),Math.min(idx,8)*100);
        io.unobserve(en.target);
      }
    });
  },{threshold:0.1});
  items.forEach(it=>io.observe(it));
}

// ===== 导出 / 导入 =====
function exportData(){
  const cur=getCurrentEvents();
  const tl=getCurrentTimeline();
  if(cur.length===0){showToast('当前时间线暂无数据可导出');return;}
  const content=JSON.stringify(cur,null,2);
  const defaultName='life-timeline-'+(tl?tl.name:'')+'-'+new Date().toISOString().slice(0,10)+'.json';
  if(window.electronAPI&&window.electronAPI.isElectron){
    window.electronAPI.exportFile({content,defaultName}).then(res=>{
      if(res.canceled)return;
      showToast('已导出「'+(tl?tl.name:'')+'」'+cur.length+' 条记录');
    }).catch(err=>{
      showToast('导出失败：'+err.message);
    });
    return;
  }
  const blob=new Blob([content],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=defaultName;
  a.click();URL.revokeObjectURL(url);
  showToast('已导出「'+(tl?tl.name:'')+'」'+cur.length+' 条记录');
}
function importData(){
  if(window.electronAPI&&window.electronAPI.importFile){
    window.electronAPI.importFile().then(res=>{
      if(res.canceled||!res.content)return;
      doImportJson(res.content);
    }).catch(err=>showToast('导入失败：'+err.message));
    return;
  }
  $importFile.click();
}
function doImportJson(text){
  try{
    const data=JSON.parse(text);
    // 完整备份格式：{type:'life-timeline-backup',events,timelines,currentTimelineId}
    if(data&&data.type==='life-timeline-backup'&&Array.isArray(data.events)&&Array.isArray(data.timelines)){
      const nEv=data.events.length,nTl=data.timelines.length;
      if(confirm('这是完整备份：包含 '+nTl+' 条时间线、'+nEv+' 条大事。\n恢复将替换当前全部数据，确定继续？')){
        events=data.events.map(e=>{if(!e.datePrecision)e.datePrecision='day';if(!e.id)e.id=uid();return e;});
        timelines=data.timelines.map(t=>{if(!t.id)t.id=uid();return t;});
        if(timelines.length===0)timelines=[{id:uid(),name:'我的时间线',emoji:'🌟',createdAt:Date.now()}];
        currentTimelineId=(data.currentTimelineId&&timelines.some(t=>t.id===data.currentTimelineId))?data.currentTimelineId:timelines[0].id;
        migrateEvents();
        persistAll();
        renderTimelineBar();
        renderTimeline();
        showToast('已恢复 '+nEv+' 条大事、'+nTl+' 条时间线');
      }
      return;
    }
    // 旧格式：事件数组 → 导入当前时间线
    if(!Array.isArray(data))throw new Error('格式错误');
    const valid=data.filter(d=>d.date&&d.title);
    if(valid.length===0)throw new Error('无有效数据');
    valid.forEach(d=>{if(!d.datePrecision)d.datePrecision='day';if(!d.id)d.id=uid();d.timelineId=currentTimelineId;});
    if(confirm('导入 '+valid.length+' 条记录到「'+(getCurrentTimeline()||{}).name+'」？当前时间线数据将被替换。')){
      events=events.filter(e=>e.timelineId!==currentTimelineId).concat(valid);saveData();renderTimelineBar();renderTimeline();showToast('已导入 '+valid.length+' 条记录');
    }
  }catch(err){showToast('导入失败：'+err.message);}
}
$importFile.addEventListener('change',(e)=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=(ev)=>{doImportJson(ev.target.result);};
  reader.readAsText(file);
  $importFile.value='';
});

// ===== 备份与恢复（手机换机迁移）=====
function buildFullBackup(){
  return {type:'life-timeline-backup',version:2,exportedAt:new Date().toISOString(),
    events:events,timelines:timelines,currentTimelineId:currentTimelineId};
}
function openBackupModal(){
  document.getElementById('backup-stats').textContent=timelines.length+' 条时间线 · '+events.length+' 条大事';
  document.getElementById('backup-overlay').classList.add('active');
}
function closeBackupModal(){document.getElementById('backup-overlay').classList.remove('active');}
function downloadTextFile(content,defaultName){
  const blob=new Blob([content],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=defaultName;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);
}
function backupDownload(){
  const content=JSON.stringify(buildFullBackup(),null,2);
  const defaultName='life-timeline-备份-'+new Date().toISOString().slice(0,10)+'.json';
  if(window.electronAPI&&window.electronAPI.isElectron){
    window.electronAPI.exportFile({content,defaultName}).then(res=>{
      if(res.canceled)return;
      showToast('备份已保存');
    }).catch(err=>showToast('备份失败：'+err.message));
    return;
  }
  downloadTextFile(content,defaultName);
  showToast('备份文件已下载，请妥善保存');
}
function backupCopy(){
  const content=JSON.stringify(buildFullBackup());
  const done=()=>{showToast('备份文本已复制，粘贴到微信收藏/备忘录保存');};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(content).then(done).catch(()=>{
      textareaCopyFallback(content);done();
    });
  }else{
    textareaCopyFallback(content);done();
  }
}
function textareaCopyFallback(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
}
function backupPasteRestore(){
  if(navigator.clipboard&&navigator.clipboard.readText){
    navigator.clipboard.readText().then(text=>{
      if(!text||!text.trim()){showToast('剪贴板是空的');return;}
      doImportJson(text);
    }).catch(()=>{showToast('无法读取剪贴板，请用「从文件恢复」');});
  }else{
    const txt=prompt('请粘贴备份文本：');
    if(txt&&txt.trim())doImportJson(txt);
  }
}
function backupFileRestore(){importData();}

document.getElementById('backup-close').addEventListener('click',closeBackupModal);
document.getElementById('backup-cancel').addEventListener('click',closeBackupModal);
document.getElementById('backup-overlay').addEventListener('click',(e)=>{if(e.target===document.getElementById('backup-overlay'))closeBackupModal();});
document.getElementById('backup-download').addEventListener('click',backupDownload);

// ===== 播放模式（时间线逐个生长）=====
const PLAYBACK_INTERVAL=950;
const PLAYBACK_LINE_DELAY=60;
const PLAYBACK_REVEAL_DELAY=180;

function renderPlaybackTimeline(){
  const sorted=[...getCurrentEvents()].sort((a,b)=>new Date(a.date)-new Date(b.date));
  function buildParts(ev){
    const emojiHtml=playbackOptions.emoji?'<div class="pb-icon-circle">'+(ev.emoji||'✨')+'</div>':'';
    const dateHtml=playbackOptions.date?'<div class="pb-date-box">'+IC.calendar+'<span>'+formatDate(ev.date,ev.datePrecision)+'</span></div>':'';
    const titleHtml=playbackOptions.title?'<div class="pb-title">'+escapeHtml(ev.title)+'</div>':'';
    const descHtml=(playbackOptions.desc&&ev.description)?'<div class="pb-desc">'+escapeHtml(ev.description)+'</div>':'';
    const catHtml=playbackOptions.category?'<span class="pb-cat-tag">'+ev.category+'</span>':'';
    const moodHtml=(playbackOptions.mood&&ev.mood)?'<span class="pb-mood">'+IC.message+escapeHtml(ev.mood)+'</span>':'';
    return{emojiHtml,dateHtml,titleHtml,descHtml,catHtml,moodHtml};
  }
  if(direction==='vertical'){
    $timeline.className='timeline timeline-vertical playback-mode';
    let html='<div class="timeline-line"></div>';
    sorted.forEach((ev)=>{
      const color=getColor(ev.category);
      const p=buildParts(ev);
      const titleBox=(playbackOptions.title||playbackOptions.category)?'<div class="pb-title-box">'+p.titleHtml+p.catHtml+'</div>':'';
      html+='<div class="pb-item" style="--node-color:'+color+'">'
        +'<div class="pb-node"></div>'
        +'<div class="pb-content">'
        +p.emojiHtml
        +'<div class="pb-text-stack">'
        +p.dateHtml
        +titleBox
        +p.descHtml
        +p.moodHtml
        +'</div></div></div>';
    });
    $timeline.innerHTML=html;
  }else{
    $timeline.className='timeline timeline-horizontal playback-mode';
    let html='<div class="timeline-line"></div><div class="timeline-track">';
    sorted.forEach((ev)=>{
      const color=getColor(ev.category);
      const p=buildParts(ev);
      const header=(playbackOptions.emoji||playbackOptions.title)?'<div class="pb-card-header">'+p.emojiHtml+p.titleHtml+'</div>':'';
      const footer=(playbackOptions.category||playbackOptions.mood)?'<div class="pb-card-footer">'+p.catHtml+p.moodHtml+'</div>':'';
      html+='<div class="pb-item" style="--node-color:'+color+'">'
        +'<div class="pb-connector"></div>'
        +'<div class="pb-node"></div>'
        +'<div class="pb-content">'
        +'<div class="pb-card">'
        +header
        +p.dateHtml
        +p.descHtml
        +footer
        +'</div></div></div>';
    });
    html+='</div>';
    $timeline.innerHTML=html;
  }
}

function startPlayback(){
  if(getCurrentEvents().length===0){showToast('当前时间线还没有微光，先捕捉几缕吧');return;}
  playbackActive=true;
  playbackIdx=0;
  renderPlaybackTimeline();
  const lineEl=$timeline.querySelector('.timeline-line');
  if(lineEl){
    if(direction==='vertical'){
      lineEl.style.width='';lineEl.style.height='0px';
    }else{
      lineEl.style.height='';lineEl.style.width='0px';
    }
  }
  window.scrollTo({top:0,behavior:'smooth'});
  $playbackBar.classList.add('active');
  $playbackProgressBar.style.width='0%';
  $playbackCount.textContent='0 / '+getCurrentEvents().length;
  setTimeout(playbackRevealNext,300);
}

function playbackRevealNext(){
  if(!playbackActive)return;
  const items=document.querySelectorAll('.pb-item');
  if(playbackIdx>=items.length){
    setTimeout(finishPlayback,700);
    return;
  }
  const item=items[playbackIdx];
  if(direction==='vertical'){
    item.scrollIntoView({behavior:'smooth',block:'center'});
  }else{
    item.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  }
  // 时间线先延伸，比事件生长更早更快
  setTimeout(()=>{
    if(!playbackActive)return;
    extendTimelineLine(item);
  },PLAYBACK_LINE_DELAY);
  // 随后事件从时间线生长出来
  setTimeout(()=>{
    if(!playbackActive)return;
    item.classList.add('grown');
    playbackIdx++;
    $playbackCount.textContent=playbackIdx+' / '+items.length;
    $playbackProgressBar.style.width=(playbackIdx/items.length*100)+'%';
    playbackTimer=setTimeout(playbackRevealNext,PLAYBACK_INTERVAL);
  },PLAYBACK_REVEAL_DELAY);
}

function extendTimelineLine(item){
  const lineEl=$timeline.querySelector('.timeline-line');
  if(!lineEl)return;
  if(direction==='vertical'){
    const h=item.offsetTop+item.offsetHeight/2;
    lineEl.style.height=Math.max(h,0)+'px';
  }else{
    const track=item.closest('.timeline-track');
    if(!track)return;
    const w=track.offsetLeft+item.offsetLeft+item.offsetWidth/2;
    lineEl.style.width=Math.max(w,0)+'px';
  }
}

function finishPlayback(){
  if(!playbackActive)return;
  // 随机选择结尾文字
  const endings=[
    {text:'loading......',poem:'岁月长如线，天地阔似笺。'},
    {text:'loading......',poem:'世界很大，等你探索。'},
  ];
  const ending=endings[Math.floor(Math.random()*endings.length)];
  var endHtml='<div class="pb-end"><div class="pb-end-content">'
    +'<div class="pb-end-text">'+ending.text+'</div>'
    +'<div class="pb-end-poem">'+ending.poem+'</div>'
    +'</div></div>';
  if(direction==='vertical'){
    $timeline.insertAdjacentHTML('beforeend',endHtml);
  }else{
    var track=$timeline.querySelector('.timeline-track');
    if(track)track.insertAdjacentHTML('beforeend',endHtml);
    else $timeline.insertAdjacentHTML('beforeend',endHtml);
  }
  var endEl=$timeline.querySelector('.pb-end');
  if(endEl){
    if(direction==='vertical'){
      endEl.scrollIntoView({behavior:'smooth',block:'center'});
    }else{
      endEl.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
    }
    // 先延长时间线到结尾位置
    var lineEl=$timeline.querySelector('.timeline-line');
    if(lineEl){
      if(direction==='vertical'){
        lineEl.style.height=($timeline.scrollHeight)+'px';
      }else{
        var tr=$timeline.querySelector('.timeline-track');
        if(tr)lineEl.style.width=(tr.offsetLeft+tr.offsetWidth)+'px';
      }
    }
    setTimeout(function(){
      if(!playbackActive)return;
      endEl.classList.add('grown');
      // 如果正在录制，播放结束后再等 2.5s 停止，让结尾文字被录到
      if(mediaRecorder&&mediaRecorder.state==='recording'){
        setTimeout(stopVideoExport,2500);
      }
    },PLAYBACK_REVEAL_DELAY);
  }
}

async function startVideoExport(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){
    showToast('当前浏览器不支持屏幕录制导出');return;
  }
  try{
    const stream=await navigator.mediaDevices.getDisplayMedia({video:{displaySurface:'browser'},audio:false});
    recordedChunks=[];
    const mimeType=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':(MediaRecorder.isTypeSupported('video/webm;codecs=vp8')?'video/webm;codecs=vp8':'video/webm');
    mediaRecorder=new MediaRecorder(stream,{mimeType:mimeType});
    mediaRecorder.ondataavailable=(e)=>{if(e.data&&e.data.size>0)recordedChunks.push(e.data);};
    mediaRecorder.onstop=downloadRecording;
    mediaRecorder.start(200);
    $playbackRecord.classList.add('recording');
    $playbackRecord.textContent='录制中';
    stream.getVideoTracks()[0].onended=()=>stopVideoExport();
    if(!playbackActive)startPlayback();
    showToast('已开始录制，播放结束或停止共享后自动保存');
  }catch(err){
    showToast('录制取消');
  }
}
function stopVideoExport(){
  $playbackRecord.classList.remove('recording');
  $playbackRecord.textContent='导出视频';
  if(mediaRecorder&&mediaRecorder.state!=='inactive'){
    try{mediaRecorder.stop();}catch(e){}
  }
  if(mediaRecorder&&mediaRecorder.stream){
    mediaRecorder.stream.getTracks().forEach(t=>{try{t.stop();}catch(e){}});
  }
  mediaRecorder=null;
}
function downloadRecording(){
  if(!recordedChunks||recordedChunks.length===0)return;
  const blob=new Blob(recordedChunks,{type:'video/webm'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='微光集-'+new Date().toISOString().slice(0,10)+'.webm';
  a.click();URL.revokeObjectURL(url);
  recordedChunks=[];
  showToast('视频已导出');
}

function exitPlayback(){
  playbackActive=false;
  clearTimeout(playbackTimer);
  $playbackBar.classList.remove('active');
  $playbackProgressBar.style.width='0%';
  stopVideoExport();
  renderTimeline();
}

// 键盘快捷键
document.addEventListener('keydown',(e)=>{
  if(e.key==='Escape'){
    $moreDropdown.classList.remove('show');
    if(playbackActive)exitPlayback();
    else if(document.getElementById('backup-overlay').classList.contains('active'))closeBackupModal();
    else if(document.getElementById('tl-form-overlay').classList.contains('active'))closeTlForm();
    else if(document.getElementById('tl-manage-overlay').classList.contains('active'))closeTlManage();
    else if($playbackSettingsOverlay.classList.contains('active'))closePlaybackSettings();
    else if($modalOverlay.classList.contains('active'))closeModal();
  }
  if(e.ctrlKey&&e.key==='n'&&!$modalOverlay.classList.contains('active')){
    e.preventDefault();openModal();
  }
});

  renderThemeDropdown();

}

// ===== PWA（可安装 App 支持）=====
(function(){
  var isElectron=!!(window.electronAPI&&window.electronAPI.isElectron);
  // 原生 App（Capacitor）里不显示"添加到主屏幕"提醒、也不注册 service worker —— App 本身就是 App，无需安装引导
  var isNative=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
  if(isNative)return;
  if(!isElectron&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
    window.addEventListener('load',function(){navigator.serviceWorker.register('service-worker.js').catch(function(){});});
  }
  if(isElectron)return;
  var standalone=window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches;
  if(standalone)return;
  var closed=false;
  try{closed=!!localStorage.getItem('pwa_hint_closed');}catch(e){}
  if(closed)return;
  setTimeout(function(){
    var hint=document.getElementById('pwa-hint');
    if(hint)hint.classList.add('show');
  },2500);
  var closeBtn=document.getElementById('pwa-hint-close');
  if(closeBtn)closeBtn.addEventListener('click',function(){
    var hint=document.getElementById('pwa-hint');
    if(hint)hint.classList.remove('show');
    try{localStorage.setItem('pwa_hint_closed','1');}catch(e){}
  });
})();
